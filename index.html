<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1024" />
        <title>Unskill Demon List</title>

        <!-- Replace your server icon by uploading an image file named "list_icon.png"-->
        <link rel="icon" href="/list_icon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@500;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" type="text/css" href="/css/reset.css" />
        <link rel="stylesheet" type="text/css" href="/css/typography.css" />
        <link rel="stylesheet" type="text/css" href="/css/main.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/list.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="/css/pages/leaderboard.css"
        />
        <link rel="stylesheet" type="text/css" href="/css/pages/roulette.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/nav.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/btn.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="/css/components/tabs.css"
        />
        <!-- Оригинальные стабильные скрипты оставлены без изменений, чтобы ничего не ломалось -->
        <script src="https://unpkg.com/vue@3.2.31/dist/vue.global.js"></script>
        <script src="https://unpkg.com/vue-router@4.0.14/dist/vue-router.global.prod.js"></script>
        <script type="module" src="/js/main.js"></script>
    </head>
    <body id="app">
        <header :class="{ dark: store.dark }">
            <div class="logo">
                <h2>UDL</h2>
                <p></p>
            </div>
            <nav class="nav">
                <router-link class="nav__tab" to="/">
                    <span class="type-label-lg">List</span>
                </router-link>
                <router-link class="nav__tab" to="/leaderboard">
                    <span class="type-label-lg">Leaderboard</span>
                </router-link>
                <router-link class="nav__tab" to="/roulette">
                    <span class="type-label-lg">Roulette</span>
                </router-link>
                <div class="nav__actions" style="display: flex; align-items: center; gap: 0.5rem;">
                    
                    <!-- Кнопка Дискорда с двумя иконками под разные темы (Переключается мгновенно через CSS) -->
                    <a class="nav__icon discord-link" href="https://discord.gg/wrE3PTVmjD" target="_blank" style="width: 3rem; height: 3rem; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: background-color 100ms ease;">
                        <img src="/assets/discord.svg" alt="Discord" class="icon-light" style="height: 1.5rem; width: auto;" />
                        <img src="/assets/discord-dark.svg" alt="Discord" class="icon-dark" style="height: 1.5rem; width: auto; display: none;" />
                    </a>

                    <button
                        class="nav__icon theme-toggle-btn"
                        @click.prevent="store.toggleDark()"
                        style="background-color: transparent; border: none; cursor: pointer; border-radius: 50%; width: 3rem; height: 3rem; display: flex; align-items: center; justify-content: center; transition: background-color 100ms ease;"
                    >
                        <img
                            :src="store.dark ? '/assets/light.svg' : '/assets/dark.svg'"
                            alt=""
                            style="height: 1.5rem;"
                        />
                    </button>
                    <!-- Ссылка на Google-форму отправки рекордов UDL -->
                    <a
                        class="nav__cta type-label-lg"
                        href="https://docs.google.com/forms/d/e/1FAIpQLSc3sYlDqF6woY2zkpQNnAcI4r0fQPitbbsKtbjX7UZadVfawQ/viewform?usp=preview"
                        target="_blank"
                        >Submit Record</a
                    >
                </div>
            </nav>
        </header>
        <router-view :class="{ dark: store.dark }"></router-view>

        <!-- Блок стилей для автоматического переключения иконок и красивого серого кружка ховера -->
        <style>
            /* СВЕТЛАЯ ТЕМА (шапка чёрная): показываем стандартную белую иконку, скрываем тёмную */
            header .discord-link .icon-light { display: inline-block !important; }
            header .discord-link .icon-dark { display: none !important; }

            /* ТЁМНАЯ ТЕМА (шапка белая): скрываем белую иконку, показываем вашу discord-dark.svg */
            header.dark .discord-link .icon-light { display: none !important; }
            header.dark .discord-link .icon-dark { display: inline-block !important; }

            /* Универсальный адаптивный серый кружок ховера для обеих кнопок при наведении мыши */
            .nav .nav__actions .nav__icon:hover {
                background-color: rgba(128, 128, 128, 0.25) !important;
            }
        </style>
    </body>
</html>
