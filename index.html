<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1024" />
        <title>Unskill Demon List</title>

        <!-- Replace your server icon by uploading an image file named "list_icon.png"-->
        <link rel="icon" href="/list_icon.png" />
        <link rel="preconnect" href="https://googleapis.com" />
        <link rel="preconnect" href="https://gstatic.com" crossorigin />
        <link
            href="https://googleapis.com/css2?family=Lexend+Deca:wght@500;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" type="text/css" href="/css/reset.css" />
        <link rel="stylesheet" type="text/css" href="/css/typography.css" />
        <link rel="stylesheet" type="text/css" href="/css/main.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/list.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="/css/pages/leaderboard.css"
        />
        <link rel="stylesheet" type="text/css" href="/css/pages/roulette.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/nav.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/btn.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="/css/components/tabs.css"
        />
        <script src="https://unpkg.com"></script>
        <script src="https://unpkg.com"></script>
        <script type="module" src="/js/main.js"></script>
    </head>
    <body id="app">
        <!-- Тег header принимает класс dark. Мы используем это для переключения картинок через CSS -->
        <header :class="{ dark: store.dark }">
            <div class="logo">
                <h2>UDL</h2>
                <p></p>
            </div>
            <nav class="nav">
                <router-link class="nav__tab" to="/">
                    <span class="type-label-lg">List</span>
                </router-link>
                <router-link class="nav__tab" to="/leaderboard">
                    <span class="type-label-lg">Leaderboard</span>
                </router-link>
                <router-link class="nav__tab" to="/roulette">
                    <span class="type-label-lg">Running Roulette</span>
                </router-link>
                <div class="nav__actions">
                    <!-- КНОПКА ТЕМЫ: Полностью возвращена к твоему ОРИГИНАЛЬНОМУ, рабочему виду -->
                    <button
                        class="nav__icon"
                        @click.prevent="store.toggleDark()"
                    >
                        <img
                            :src="store.dark ? '/assets/light.svg' : '/assets/dark.svg'"
                            alt=""
                        />
                    </button>
                    
                    <!-- КНОПКА ДИСКОРДА: Обычные статичные пути, которые никогда не сломают Vue -->
                    <a class="nav__icon discord-link" href="https://discord.gg">
                        <img src="/assets/discord.svg" alt="Discord Logo" class="icon-light" />
                        <img src="/assets/discord-dark.svg" alt="Discord Logo" class="icon-dark" />
                    </a>

                    <!-- Форма отправки рекордов UDL -->
                    <a
                        class="nav__cta type-label-lg"
                        href="https://google.com"
                        target="_blank"
                        >Submit Record</a
                    >
                </div>
            </nav>
        </header>
        <router-view :class="{ dark: store.dark }"></router-view>

        <!-- Чистый CSS-блок переключения иконок Дискорда без костылей и инлайнов -->
        <style>
            /* В обычном режиме показываем светлую иконку, скрываем темную */
            header .discord-link .icon-light { display: inline-block; }
            header .discord-link .icon-dark { display: none; }

            /* Когда на header накладывается класс .dark, плавно меняем их местами */
            header.dark .discord-link .icon-light { display: none; }
            header.dark .discord-link .icon-dark { display: inline-block; }
        </style>
    </body>
</html>
