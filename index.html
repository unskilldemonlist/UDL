<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Geometry Dash Demon List</title>

        <!-- Подключение стилей шаблона (благодаря им сайт выглядит красиво) -->
        <link rel="stylesheet" href="css/reset.css" />
        <link rel="stylesheet" href="css/typography.css" />
        <link rel="stylesheet" href="css/main.css" />
        <link rel="stylesheet" href="css/components/nav.css" />
        <link rel="stylesheet" href="css/components/btn.css" />
        <link rel="stylesheet" href="css/components/tabs.css" />

        <!-- Подключение Vue 3 и Vue Router через CDN -->
        <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
        <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
    </head>
    <body>
        <div id="app">
            <!-- Шапка сайта с навигацией -->
            <header class="header">
                <nav class="nav">
                    <router-link class="nav__tab" to="/">
                        <span class="type-label-lg">List</span>
                    </router-link>
                    <router-link class="nav__tab" to="/future">
                        <span class="type-label-lg">Future</span>
                    </router-link>
                    <router-link class="nav__tab" to="/leaderboard">
                        <span class="type-label-lg">Leaderboard</span>
                    </router-link>
                    <router-link class="nav__tab" to="/roulette">
                        <span class="type-label-lg">Roulette</span>
                    </router-link>
                    <div class="nav__actions">
                        <button
                            class="nav__icon"
                            @click.prevent="store.toggleDark()"
                        >
                            <img
                                :src="store.dark ? '/assets/light.svg' : '/assets/dark.svg'"
                                alt=""
                            />
                        </button>
                        <a class="nav__icon" href="https://discord.gg/wrE3PTVmjD" target="_blank">
                            <img :src="store.dark ? '/assets/discord.svg' : '/assets/discord-dark.svg'" alt="Discord Logo" />
                        </a>
                        <a
                            class="nav__cta type-label-lg"
                            href="https://docs.google.com/forms/d/e/1FAIpQLSc3sYlDqF6woY2zkpQNnAcI4r0fQPitbbsKtbjX7UZadVfawQ/viewform?usp=preview"
                            target="_blank"
                            >Submit Record</a
                        >
                    </div>
                </nav>
            </header>

            <!-- Основной контент страниц -->
            <router-view></router-view>
        </div>

        <!-- Подключение логики приложения -->
        <script src="js/main.js" type="module"></script>
    </body>
</html>
